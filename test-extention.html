<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page de test — StockWatch</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif}
.card{width:min(440px,92vw);background:#fff;color:#000;border-radius:24px;padding:32px}.tag{font-size:11px;letter-spacing:.25em;color:#777}h1{margin:8px 0 4px;font-size:26px;letter-spacing:-.02em}
.price{font-size:20px;font-weight:700;margin-bottom:18px}#state{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;margin-bottom:14px}
.out{background:#000;color:#fff}.in{background:#ff1a1a;color:#fff}.btn{width:100%;padding:15px;border-radius:14px;border:2px solid #000;background:#000;color:#fff;font:700 15px system-ui;cursor:pointer}.btn:disabled{background:#eee;color:#888;border-color:#ddd;cursor:not-allowed}
.ctl{margin-top:22px;padding-top:18px;border-top:1px solid #eee;display:grid;gap:10px;font-size:13px}.ctl .r{display:flex;gap:8px}.ctl button{flex:1;padding:9px;border-radius:10px;border:1px solid #000;background:#fff;font:600 12px system-ui;cursor:pointer}
small{color:#777;line-height:1.5}</style></head><body><div class="card">
<div class="tag">UNWARE STUDIO · PAGE DE TEST</div><h1>Produit de test</h1><div class="price">29,90 €</div>
<span id="state" class="out">RUPTURE</span>
<button id="add-to-cart" class="btn" type="button" disabled>Épuisé</button>
<div class="ctl"><div class="r"><button id="on">Passer EN STOCK</button><button id="off">Passer en RUPTURE</button></div>
<label><input type="checkbox" id="auto"> Cycle auto : rupture <span id="n">20</span> s → en stock 20 s</label><div id="cd"></div>
<small>Dans StockWatch : « + Page de test » (mode Onglet ouvert). Garde cet onglet ouvert. Astuce : <code>?stock=1</code> démarre en stock.</small></div></div>
<script>
const b=document.getElementById('add-to-cart'),s=document.getElementById('state');let t=null,left=0,inStock=false;
function set(v){inStock=v;b.disabled=!v;b.textContent=v?'Ajouter au panier':'Épuisé';s.textContent=v?'EN STOCK':'RUPTURE';s.className=v?'in':'out'}
document.getElementById('on').onclick=()=>set(true);document.getElementById('off').onclick=()=>set(false);
document.getElementById('auto').onchange=e=>{clearInterval(t);document.getElementById('cd').textContent='';if(!e.target.checked)return;set(false);left=20;
t=setInterval(()=>{left--;if(left<=0){set(!inStock);left=20}document.getElementById('cd').textContent='Prochain changement dans '+left+' s'},1000)};
if(new URLSearchParams(location.search).get('stock')==='1')set(true);
</script></body></html>
