<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration · Maison Unware</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}:root{--serif:'Cormorant Garamond',Didot,Georgia,serif}*{box-sizing:border-box}body{margin:0;background:#f6f2ec;color:#111;font:14px/1.6 Inter,system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;background:#111;color:#f6f2ec}.logo{font:500 22px var(--serif);letter-spacing:.3em}header a,header button{color:#f6f2ec;font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;background:none;border:0;cursor:pointer;margin-left:22px}
main{max-width:820px;margin:40px auto;padding:0 20px;display:grid;gap:20px}.card{background:#fff;border:1px solid #ddd6cb;padding:26px}h2{margin:0 0 16px;font:500 24px var(--serif)}h3{margin:0 0 12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7a746b;font-weight:600}
.prod{display:flex;justify-content:space-between;align-items:center;gap:20px}.prod small{color:#7a746b}.badge{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border-radius:99px;color:#fff}.in{background:#2f6b3a}.out{background:#9b2c2c}.big{font:500 54px/1 var(--serif);text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}input{padding:10px;border:1px solid #ddd6cb;width:90px;font:inherit}
button.b{padding:12px 20px;background:#111;color:#fff;border:1px solid #111;font:600 11px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}button.g{background:#fff;color:#111}button.b:hover{opacity:.8}
ul{list-style:none;margin:0;padding:0;font-size:13px;color:#555}li{padding:7px 0;border-top:1px solid #eee}#login{min-height:100vh;display:grid;place-items:center}#login form{background:#fff;border:1px solid #ddd6cb;padding:40px;display:grid;gap:12px;text-align:center;width:min(340px,90vw)}#login input{width:100%}
</style></head><body>
<div id="login"><form id="lf"><div class="logo" style="font:500 22px var(--serif);letter-spacing:.3em">MAISON UNWARE</div><small>Administration</small><input id="pw" type="password" placeholder="Mot de passe" autofocus><button class="b">Entrer</button><small>Mot de passe de test : admin</small></form></div>
<div id="app" hidden>
<header><span class="logo">MAISON UNWARE · ADMIN</span><span><a href="produit-test.html" target="_blank">Voir la boutique ↗</a><button id="out">Déconnexion</button></span></header>
<main>
<div class="card"><h3>Produit</h3><div class="prod"><div><h2 style="margin:0">Calendrier de l’Avent — Tome 2</h2><small>UW-CAL-002 · 89,00 €</small><div style="margin-top:10px"><span id="badge" class="badge out">Rupture</span></div></div><div><div class="big" id="qtyv">0</div><small>en stock</small></div></div></div>
<div class="card"><h3>Gestion du stock</h3>
<div class="row"><label>Quantité</label><input id="q" type="number" min="1" value="10"><button class="b" id="on">Mettre en stock</button><button class="b g" id="off">Mettre en rupture</button></div>
<div class="row" style="margin-top:22px"><label>Réassort dans</label><input id="sec" type="number" min="3" value="30"><label>secondes</label><button class="b g" id="sch">Programmer</button><button class="b g" id="cancel">Annuler</button></div>
<div id="cd" style="margin-top:10px;color:#7a746b"></div></div>
<div class="card"><h3>Journal</h3><ul id="log"></ul><div class="row"><button class="b g" id="clr">Vider le journal</button></div></div>
</main></div>
<script>
const K='unware_stock',L='unware_log',$=id=>document.getElementById(id);
const get=()=>{try{return JSON.parse(localStorage.getItem(K))||{qty:0}}catch{return{qty:0}}},save=s=>localStorage.setItem(K,JSON.stringify(s));
const logs=()=>JSON.parse(localStorage.getItem(L)||'[]'),log=t=>localStorage.setItem(L,JSON.stringify([new Date().toLocaleTimeString('fr-FR')+' — '+t,...logs()].slice(0,10)));
function norm(){const s=get();if(s.restockAt&&Date.now()>=s.restockAt){s.qty=s.restockQty||5;delete s.restockAt;delete s.restockQty;save(s);log('Réassort effectué : '+s.qty+' pièces')}return s}
const qv=()=>Math.max(1,+$('q').value||10);
$('on').onclick=()=>{const s=get();s.qty=qv();delete s.restockAt;delete s.restockQty;save(s);log('Mise en stock : '+s.qty+' pièces');render()};
$('off').onclick=()=>{save({qty:0});log('Mise en rupture');render()};
$('sch').onclick=()=>{const n=Math.max(3,+$('sec').value||30);save({qty:0,restockAt:Date.now()+n*1000,restockQty:qv()});log('Réassort programmé dans '+n+' s');render()};
$('cancel').onclick=()=>{const s=get();delete s.restockAt;delete s.restockQty;save(s);log('Réassort annulé');render()};
$('clr').onclick=()=>{localStorage.removeItem(L);render()};
function render(){const s=norm(),on=s.qty>0;$('qtyv').textContent=s.qty|0;$('badge').className='badge '+(on?'in':'out');$('badge').textContent=on?'En stock':'Rupture';
$('cd').textContent=s.restockAt?'Réassort de '+s.restockQty+' pièces dans '+Math.max(0,Math.ceil((s.restockAt-Date.now())/1000))+' s':'';
$('log').innerHTML=logs().map(x=>'<li>'+x+'</li>').join('')||'<li>Aucune activité</li>'}
function gate(){const ok=sessionStorage.getItem('uw_admin')==='1';$('login').hidden=ok;$('app').hidden=!ok;if(ok)render()}
$('lf').onsubmit=e=>{e.preventDefault();if($('pw').value==='admin'){sessionStorage.setItem('uw_admin','1');gate()}else{$('pw').value='';$('pw').placeholder='Mot de passe incorrect'}};
$('out').onclick=()=>{sessionStorage.removeItem('uw_admin');gate()};
addEventListener('storage',()=>{if(!$('app').hidden)render()});setInterval(()=>{if(!$('app').hidden)render()},1000);gate();
</script></body></html>
