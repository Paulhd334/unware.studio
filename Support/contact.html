<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maintenance | UNWARE STUDIO</title>
<meta name="description" content="Le site UNWARE STUDIO est actuellement en maintenance. Merci de votre patience.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://unware.studio/maintenance.html">

<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/images/favicons/apple-touch-icon.png">

<!-- Préconnexions -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">

</head>
<body>

<style>
    :root {
        --primary: #0a0a0a;
        --secondary: #111111;
        --accent: #ffffff;
        --accent-glow: #ffffff;
        --text: #e0e0e0;
        --text-secondary: #888888;
        --card-bg: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --transition: all 0.3s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        background-color: var(--primary);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        line-height: 1.6;
        overflow-x: hidden;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    header { position: relative; z-index: 10; padding: 24px 0; }
    .nav-container { display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { font-size: 20px; color: var(--accent); }
    .logo-text img { height: 28px; }

    .btn {
        padding: 12px 24px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        line-height: 1;
    }
    .btn-login { color: var(--text); background: transparent; border: 1px solid var(--border); height: 42px; }
    .btn-login:hover { background: rgba(255,255,255,0.05); transform: translateY(-2px); }
    .btn-primary { background: var(--accent); color: var(--primary); border: none; height: 42px; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

    /* Maintenance hero */
    .hero {
        min-height: calc(100vh - 160px);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 60px 0;
    }
    .hero-content { max-width: 640px; margin: 0 auto; }

    .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-secondary);
        border: 1px solid var(--border);
        background: var(--card-bg);
        padding: 8px 18px;
        border-radius: 999px;
        margin-bottom: 32px;
    }
    .status-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--accent);
        display: inline-block;
        animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .hero-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 4rem;
        line-height: 0.95;
        letter-spacing: 1px;
        margin-bottom: 24px;
        color: var(--accent);
    }

    .hero-subtitle {
        font-size: 1.1rem;
        color: var(--text-secondary);
        max-width: 480px;
        margin: 0 auto 40px;
    }

    .hero-actions {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }

    /* Footer */
    footer { border-top: 1px solid var(--border); padding: 40px 0; margin-top: 40px; }
    .footer-content { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
    .footer-desc { color: var(--text-secondary); font-size: 14px; }
    .social-links { display: flex; gap: 14px; }
    .social-link {
        width: 38px; height: 38px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
        transition: var(--transition);
    }
    .social-link:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
    .copyright { color: var(--text-secondary); font-size: 12.5px; opacity: 0.7; }

    @media (max-width: 768px) {
        .hero-title { font-size: 2.8rem; }
        .hero-actions { flex-direction: column; align-items: center; }
        .btn { width: 100%; max-width: 280px; }
    }
</style>



<!-- Section maintenance -->
<section class="hero">
    <div class="container hero-content">
        <span class="hero-badge"><span class="status-dot"></span> Maintenance en cours</span>
        <h1 class="hero-title">Site en maintenance</h1>
        <p class="hero-subtitle">Nous effectuons actuellement des travaux sur le site. Aucune date de retour n'est fixée pour le moment — merci de votre patience.</p>
        <div class="hero-actions">
            <a href="https://discord.gg/PE7MS4Sazk" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Rejoindre le Discord</a>
            <a href="https://linktr.ee/UNWARE.STUDIO" class="btn btn-login" target="_blank" rel="noopener noreferrer">Nos réseaux</a>
        </div>
    </div>
</section>



</body>
</html>
